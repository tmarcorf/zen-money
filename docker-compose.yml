# ============================================================
# ZenMoney — Docker Compose
# PostgreSQL 16 + .NET 8 API + React/Vite Frontend
# ============================================================
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d --build      # Rebuild images and start
#   docker compose down               # Stop and remove containers
#   docker compose logs -f api        # Follow API logs
#
# Override secrets in production via a .env file or shell exports:
#   JWT_SECRET_KEY=<your-key>
#   POSTGRES_PASSWORD=<your-password>
# ============================================================

services:
  # ---- PostgreSQL 16 ----
  db:
    image: postgres:16-alpine
    container_name: zenmoney-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ZenMoneyDB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - zenmoney-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ZenMoneyDB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security: run as the built-in postgres user (already non-root in alpine image)

  # ---- .NET 8 Backend API ----
  api:
    build:
      context: ./src/api
      dockerfile: Dockerfile
    container_name: zenmoney-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-7109}:8080"
    environment:
      # Database connection — uses Docker DNS service name "db"
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-ZenMoneyDB};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      # JWT — MUST be overridden in production (min 32 chars)
      - Jwt__SecretKey=${JWT_SECRET_KEY:-dev-secret-change-me-in-production-min-32-chars!!}
      - Jwt__Issuer=${JWT_ISSUER:-https://tmarcorf-tech.vercel.app}
      - Jwt__Audience=${JWT_AUDIENCE:-https://tmarcorf-tech.vercel.app}
      # Disable HTTPS redirection inside the container
      - NoHttpsRedirection=true
      # CORS origins allowed (browser origin of the frontend)
      - Cors__Origins=${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zenmoney-network

  # ---- React + Vite Frontend ----
  frontend:
    build:
      context: ./src/web-app
      dockerfile: Dockerfile
      args:
        # Injected at Vite build time — this is the URL the browser uses to reach the API
        - VITE_API_URL=${VITE_API_URL:-http://localhost:7109}
    container_name: zenmoney-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - zenmoney-network

# ---- Volumes ----
volumes:
  pgdata:
    driver: local
    name: zenmoney-pgdata

# ---- Networks ----
networks:
  zenmoney-network:
    driver: bridge
    name: zenmoney-network
